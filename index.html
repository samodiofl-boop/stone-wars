<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stone Wars">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Stone Wars</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      width: 100%;
      height: 100vh;
      background: #000;
      position: relative;
    }
    .status-bar {
      height: 54px;
      padding: 12px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }
    .status-time {
      font-size: 17px;
      font-weight: 600;
      color: white;
    }
    .contacts-screen {
      height: 100%;
      background: #000;
      padding-top: 54px;
      overflow-y: auto;
    }
    .contacts-header {
      padding: 8px 16px 12px;
    }
    .contacts-title {
      font-size: 34px;
      font-weight: 700;
      color: white;
      margin-bottom: 12px;
    }
    .contacts-list {
      padding: 0 0 100px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 15px;
      cursor: pointer;
      border-bottom: 0.5px solid #2c2c2e;
    }
    .contact-item:active {
      background: #1c1c1e;
    }
    .contact-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #2c2c2e;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .contact-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .contact-info {
      flex: 1;
    }
    .contact-name {
      font-size: 18px;
      color: white;
      margin-bottom: 2px;
    }
    .contact-subtitle {
      font-size: 14px;
      color: #8e8e93;
    }
    .contact-action svg {
      width: 24px;
      height: 24px;
      fill: #30d158;
    }
    .call-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .call-screen.active {
      display: flex;
    }
    .call-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-size: cover;
      background-position: center top;
    }
    .call-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 20%, transparent 60%, rgba(0,0,0,0.8) 100%);
    }
    .call-header {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
    }
    .call-name {
      font-size: 24px;
      font-weight: 600;
      color: white;
    }
    .call-status {
      font-size: 15px;
      color: rgba(255,255,255,0.8);
      margin-top: 4px;
    }
    .self-video {
      position: absolute;
      top: 70px;
      right: 16px;
      width: 100px;
      height: 140px;
      background: #1a1a1a;
      border-radius: 16px;
      overflow: hidden;
      z-index: 20;
    }
    .self-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .listening-indicator {
      position: absolute;
      bottom: 150px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      opacity: 0;
    }
    .listening-indicator.active {
      opacity: 1;
    }
    .listening-dot {
      width: 12px;
      height: 12px;
      background: #30d158;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    .listening-dot:nth-child(2) { animation-delay: 0.2s; }
    .listening-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    .call-controls {
      position: absolute;
      bottom: 50px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
    }
    .end-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #ff3b30;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .end-btn svg {
      width: 30px;
      height: 30px;
      fill: white;
    }
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: rgba(18,18,18,0.95);
      border-top: 0.5px solid #2c2c2e;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 28px;
      z-index: 50;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0.6;
    }
    .tab-item.active {
      opacity: 1;
    }
    .tab-item svg {
      width: 28px;
      height: 28px;
      fill: #8e8e93;
    }
    .tab-item.active svg {
      fill: #007aff;
    }
    .tab-item span {
      font-size: 10px;
      color: #8e8e93;
    }
    .tab-item.active span {
      color: #007aff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-bar">
      <div class="status-time" id="statusTime">9:41</div>
    </div>
    
    <div class="contacts-screen">
      <div class="contacts-header">
        <h1 class="contacts-title">Contacts</h1>
      </div>
      <div class="contacts-list" id="contactsList"></div>
      <div class="tab-bar">
        <div class="tab-item active">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>Contacts</span>
        </div>
        <div class="tab-item">
          <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2z"/></svg>
          <span>Recents</span>
        </div>
        <div class="tab-item">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
          <span>Favorites</span>
        </div>
      </div>
    </div>
    
    <div class="call-screen" id="callScreen">
      <div class="call-bg" id="callBg"></div>
      <div class="call-overlay"></div>
      <div class="call-header">
        <div class="call-name" id="callName">Yoda</div>
        <div class="call-status" id="callStatus">Connecting...</div>
      </div>
      <div class="self-video" id="selfVideo"></div>
      <div class="listening-indicator" id="listening">
        <div class="listening-dot"></div>
        <div class="listening-dot"></div>
        <div class="listening-dot"></div>
      </div>
      <div class="call-controls">
        <button class="end-btn" id="endBtn">
          <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
        </button>
      </div>
    </div>
  </div>
  
  <audio id="audio" playsinline webkit-playsinline></audio>
  
  <script>
    var API = "https://stone-wars-api.samodio-fl.workers.dev";
    
    var chars = [
      { id: "yoda", name: "Yoda", subtitle: "Jedi Master", img: "https://raw.githubusercontent.com/samodiofl-boop/stone-wars/main/vader.jpg" },
      { id: "vader", name: "Darth Vader", subtitle: "Sith Lord", img: "https://raw.githubusercontent.com/samodiofl-boop/stone-wars/main/vader.jpg" }
    ];
    
    var current = null;
    var recorder = null;
    var chunks = [];
    var recording = false;
    var speaking = false;
    var active = false;
    var stream = null;
    var timer = null;
    var ctx = null;
    
    var list = document.getElementById("contactsList");
    var screen = document.getElementById("callScreen");
    var bg = document.getElementById("callBg");
    var name = document.getElementById("callName");
    var status = document.getElementById("callStatus");
    var end = document.getElementById("endBtn");
    var audio = document.getElementById("audio");
    var self = document.getElementById("selfVideo");
    var listen = document.getElementById("listening");
    var clock = document.getElementById("statusTime");
    
    function time() {
      var d = new Date();
      var h = d.getHours();
      var m = d.getMinutes();
      clock.textContent = h + ":" + (m < 10 ? "0" : "") + m;
    }
    time();
    setInterval(time, 1000);
    
    function render() {
      var h = "";
      for (var i = 0; i < chars.length; i++) {
        var c = chars[i];
        h += '<div class="contact-item" onclick="call(\'' + c.id + '\')">';
        h += '<div class="contact-avatar"><img src="' + c.img + '" onerror="this.parentElement.textContent=\'👤\'"></div>';
        h += '<div class="contact-info"><div class="contact-name">' + c.name + '</div>';
        h += '<div class="contact-subtitle">' + c.subtitle + '</div></div>';
        h += '<div class="contact-action"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></div>';
        h += '</div>';
      }
      list.innerHTML = h;
    }
    
    function initAudio() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      audio.src = "data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7v/////////////////////////////////"
      audio.play().catch(function(){});
    }
    
    function startCam() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then(function(s) {
          stream = s;
          var v = document.createElement("video");
          v.srcObject = s;
          v.autoplay = true;
          v.playsInline = true;
          v.muted = true;
          self.innerHTML = "";
          self.appendChild(v);
        }).catch(function(){});
    }
    
    function stopCam() {
      if (stream) {
        stream.getTracks().forEach(function(t) { t.stop(); });
        stream = null;
      }
      self.innerHTML = "";
    }
    
    function setupMic() {
      return navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(s) {
          recorder = new MediaRecorder(s, { mimeType: "audio/webm" });
          recorder.ondataavailable = function(e) {
            if (e.data.size > 0) chunks.push(e.data);
          };
          recorder.onstop = function() {
            var blob = new Blob(chunks, { type: "audio/webm" });
            chunks = [];
            if (blob.size > 1000 && active) {
              send(blob);
            } else if (active) {
              startListen();
            }
          };
          return true;
        }).catch(function() { return false; });
    }
    
    function startListen() {
      if (!recorder || speaking || !active) return;
      chunks = [];
      recorder.start();
      recording = true;
      listen.classList.add("active");
      timer = setTimeout(function() {
        if (recording) stopListen();
      }, 5000);
    }
    
    function stopListen() {
      if (!recorder || !recording) return;
      clearTimeout(timer);
      recorder.stop();
      recording = false;
      listen.classList.remove("active");
    }
    
    function call(id) {
      current = null;
      for (var i = 0; i < chars.length; i++) {
        if (chars[i].id === id) current = chars[i];
      }
      if (!current) return;
      
      initAudio();
      active = true;
      screen.classList.add("active");
      bg.style.backgroundImage = "url(" + current.img + ")";
      name.textContent = current.name;
      status.textContent = "Connecting...";
      startCam();
      
      setupMic().then(function() {
        return fetch(API + "/api/startCall", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ character: id })
        });
      }).then(function(r) {
        return r.json();
      }).then(function(d) {
        if (d.error) throw new Error(d.error);
        status.textContent = "Connected";
        play(d.audio);
      }).catch(function(e) {
        console.error(e);
        status.textContent = "Failed";
        setTimeout(hangup, 2000);
      });
    }
    
    function send(blob) {
      if (!active) return;
      listen.classList.remove("active");
      status.textContent = "Thinking...";
      
      var fd = new FormData();
      fd.append("character", current.id);
      fd.append("audio", blob);
      
      fetch(API + "/api/chat", { method: "POST", body: fd })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.error) throw new Error(d.error);
          play(d.audio);
        }).catch(function(e) {
          console.error(e);
          status.textContent = "Connected";
          if (active) startListen();
        });
    }
    
    function play(url) {
      if (!url || !active) {
        if (active) startListen();
        return;
      }
      speaking = true;
      status.textContent = "Speaking...";
      audio.src = url;
      audio.onended = function() {
        speaking = false;
        status.textContent = "Connected";
        if (active) startListen();
      };
      audio.onerror = function() {
        speaking = false;
        status.textContent = "Connected";
        if (active) startListen();
      };
      audio.play().catch(function() {
        speaking = false;
        if (active) startListen();
      });
    }
    
    function hangup() {
      active = false;
      stopCam();
      stopListen();
      if (recorder && recorder.state !== "inactive") recorder.stop();
      audio.pause();
      audio.src = "";
      current = null;
      recording = false;
      speaking = false;
      screen.classList.remove("active");
    }
    
    end.onclick = hangup;
    render();
  </script>
</body>
</html>
