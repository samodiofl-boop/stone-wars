<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stone Wars">
  <title>Stone Wars</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #000; min-height: 100vh; min-height: -webkit-fill-available; overflow: hidden; }
    .iphone-container { width: 100%; height: 100vh; height: -webkit-fill-available; background: #000; position: relative; overflow: hidden; }
    .status-bar { height: 54px; padding: 12px 24px 0; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); position: absolute; top: 0; left: 0; right: 0; z-index: 100; }
    .status-time { font-size: 17px; font-weight: 600; color: white; }
    .status-icons { display: flex; gap: 5px; align-items: center; }
    .status-icons svg { width: 18px; height: 18px; fill: white; }
    .battery { width: 27px; height: 13px; border: 1.5px solid white; border-radius: 4px; padding: 2px; position: relative; }
    .battery::after { content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 2px; height: 6px; background: white; border-radius: 0 2px 2px 0; }
    .battery-fill { width: 80%; height: 100%; background: white; border-radius: 2px; }
    .contacts-screen { height: 100%; background: #000; padding-top: 54px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .contacts-header { padding: 8px 16px 12px; background: #000; }
    .contacts-title { font-size: 34px; font-weight: 700; color: white; margin-bottom: 12px; }
    .search-bar { background: #1c1c1e; border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
    .search-bar svg { width: 18px; height: 18px; fill: #8e8e93; }
    .search-bar span { color: #8e8e93; font-size: 17px; }
    .contacts-list { padding: 0 0 100px; }
    .contact-item { display: flex; align-items: center; padding: 12px 16px; gap: 15px; cursor: pointer; transition: background 0.15s; border-bottom: 0.5px solid #2c2c2e; }
    .contact-item:active { background: #1c1c1e; }
    .contact-avatar { width: 60px; height: 60px; border-radius: 50%; background: #2c2c2e; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .contact-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .contact-info { flex: 1; }
    .contact-name { font-size: 18px; font-weight: 400; color: white; margin-bottom: 2px; }
    .contact-subtitle { font-size: 14px; color: #8e8e93; }
    .contact-action { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    .contact-action svg { width: 24px; height: 24px; fill: #30d158; }
    .facetime-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
    .facetime-screen.active { display: flex; }
    .facetime-video-container { flex: 1; position: relative; overflow: hidden; }
    .facetime-video-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-size: cover; background-position: center top; }
    .facetime-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 20%, transparent 60%, rgba(0,0,0,0.8) 100%); }
    .facetime-header { position: absolute; top: 60px; left: 0; right: 0; text-align: center; z-index: 10; }
    .facetime-name { font-size: 24px; font-weight: 600; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .facetime-status { font-size: 15px; color: rgba(255,255,255,0.8); margin-top: 4px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
    .facetime-subtitle { position: absolute; bottom: 260px; left: 20px; right: 20px; text-align: center; z-index: 10; }
    .subtitle-text { display: inline-block; background: rgba(0,0,0,0.7); color: white; font-size: 18px; font-weight: 500; padding: 12px 20px; border-radius: 12px; max-width: 90%; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
    .subtitle-text.visible { opacity: 1; transform: translateY(0); }
    .self-video { position: absolute; top: 70px; right: 16px; width: 100px; height: 140px; background: #1a1a1a; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 20; }
    .self-video video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .self-video-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #2c2c2e, #1c1c1e); }
    .self-video-placeholder svg { width: 40px; height: 40px; fill: #48484a; }
    .facetime-controls { position: absolute; bottom: 50px; left: 0; right: 0; z-index: 10; }
    .controls-row { display: flex; justify-content: center; gap: 30px; padding: 0 30px; margin-bottom: 20px; }
    .control-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s, opacity 0.15s; border: none; outline: none; }
    .control-btn:active { transform: scale(0.92); opacity: 0.8; }
    .control-btn svg { width: 30px; height: 30px; }
    .control-btn.talk { background: #30d158; width: 90px; height: 90px; }
    .control-btn.talk.recording { background: #ff3b30; animation: pulse-recording 1s ease-in-out infinite; }
    .control-btn.talk svg { fill: white; width: 40px; height: 40px; }
    .control-btn.end-call { background: #ff3b30; }
    .control-btn.end-call svg { fill: white; }
    .control-btn.action { background: rgba(255,255,255,0.2); }
    .control-btn.action svg { fill: white; }
    .control-btn:disabled { opacity: 0.5; pointer-events: none; }
    @keyframes pulse-recording { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.5); } 50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); } }
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 84px; background: rgba(18,18,18,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid #2c2c2e; display: flex; justify-content: space-around; padding: 8px 0 28px; z-index: 50; }
    .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0.6; }
    .tab-item.active { opacity: 1; }
    .tab-item svg { width: 28px; height: 28px; fill: #8e8e93; }
    .tab-item.active svg { fill: #007aff; }
    .tab-item span { font-size: 10px; color: #8e8e93; }
    .tab-item.active span { color: #007aff; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } }
    .connecting .facetime-video-bg { animation: pulse 2s ease-in-out infinite; }
    .home-indicator { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: white; border-radius: 3px; z-index: 1000; opacity: 0.6; }
    .thinking-dots { display: flex; gap: 6px; justify-content: center; padding: 10px; }
    .thinking-dots span { width: 10px; height: 10px; background: white; border-radius: 50%; animation: bounce 1.4s ease-in-out infinite; }
    .thinking-dots span:nth-child(1) { animation-delay: 0s; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-10px); opacity: 1; } }
    .speaking-waves { display: flex; gap: 4px; justify-content: center; align-items: center; height: 30px; }
    .speaking-waves span { width: 4px; background: #30d158; border-radius: 2px; animation: wave 0.5s ease-in-out infinite; }
    .speaking-waves span:nth-child(1) { height: 10px; animation-delay: 0s; }
    .speaking-waves span:nth-child(2) { height: 20px; animation-delay: 0.1s; }
    .speaking-waves span:nth-child(3) { height: 15px; animation-delay: 0.2s; }
    .speaking-waves span:nth-child(4) { height: 25px; animation-delay: 0.3s; }
    .speaking-waves span:nth-child(5) { height: 12px; animation-delay: 0.4s; }
    @keyframes wave { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.5); } }
  </style>
</head>
<body>
  <div class="iphone-container">
    <div class="status-bar">
      <div class="status-time" id="statusTime">9:41</div>
      <div class="status-icons">
        <svg viewBox="0 0 24 24"><path d="M12 3C7.5 3 3.75 5.25 1.5 9L12 21L22.5 9C20.25 5.25 16.5 3 12 3Z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M2 17H4V7H2V17ZM6 17H8V4H6V17ZM10 17H12V7H10V17ZM14 17H16V10H14V17ZM18 17H20V13H18V17Z"/></svg>
        <div class="battery"><div class="battery-fill"></div></div>
      </div>
    </div>
    <div class="contacts-screen" id="contactsScreen">
      <div class="contacts-header">
        <h1 class="contacts-title">Contacts</h1>
        <div class="search-bar">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 001.48-5.34c-.47-2.78-2.79-5-5.59-5.34A6.505 6.505 0 003.03 10.5c0 3.59 2.91 6.5 6.5 6.5 1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0c-2.49 0-4.5-2.01-4.5-4.5S7.01 5 9.5 5 14 7.01 14 9.5 12.49 14 9.5 14z"/></svg>
          <span>Search</span>
        </div>
      </div>
      <div class="contacts-list" id="contactsList"></div>
      <div class="tab-bar">
        <div class="tab-item active"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Contacts</span></div>
        <div class="tab-item"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span>Recents</span></div>
        <div class="tab-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><span>Favorites</span></div>
      </div>
    </div>
    <div class="facetime-screen" id="facetimeScreen">
      <div class="facetime-video-container">
        <div class="facetime-video-bg" id="facetimeBackground"></div>
        <div class="facetime-overlay"></div>
        <div class="facetime-header"><div class="facetime-name" id="facetimeName">Yoda</div><div class="facetime-status" id="facetimeStatus">FaceTime Video</div></div>
        <div class="self-video" id="selfVideo"><div class="self-video-placeholder"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div></div>
        <div class="facetime-subtitle"><div class="subtitle-text" id="subtitleText"></div></div>
        <div class="facetime-controls">
          <div class="controls-row">
            <button class="control-btn action" id="againBtn"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
            <button class="control-btn talk" id="talkBtn"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            <button class="control-btn end-call" id="endCallBtn"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button>
          </div>
        </div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
  <audio id="audioPlayer" style="display: none;"></audio>
  <script>
    const API_BASE = 'https://stone-wars-api.samodio-fl.workers.dev';
    const characters = [
      { id: 'yoda', name: 'Yoda', subtitle: 'Jedi Master', emoji: '🟢', image: 'https://upload.wikimedia.org/wikipedia/en/6/6f/Yoda_Attack_of_the_Clones.png' },
      { id: 'vader', name: 'Darth Vader', subtitle: 'Sith Lord', emoji: '⚫', image: 'https://upload.wikimedia.org/wikipedia/en/7/76/Darth_Vader.jpg' },
      { id: 'chewie', name: 'Chewbacca', subtitle: 'Wookiee Warrior', emoji: '🟤', image: 'https://upload.wikimedia.org/wikipedia/en/6/6d/Chewbacca-fd9f5e45.jpg' },
      { id: 'r2d2', name: 'R2-D2', subtitle: 'Astromech Droid', emoji: '🔵', image: 'https://upload.wikimedia.org/wikipedia/en/3/39/R2-D2_Droid.png' },
      { id: 'obiwan', name: 'Obi-Wan Kenobi', subtitle: 'Jedi Master', emoji: '🔵', image: 'https://upload.wikimedia.org/wikipedia/en/b/be/Obi-Wan_Kenobi_in_Attack_of_the_Clones.jpg' },
      { id: 'grogu', name: 'Grogu', subtitle: 'The Child', emoji: '🟢', image: 'https://upload.wikimedia.org/wikipedia/en/0/00/The_Child_aka_Baby_Yoda_%28Star_Wars%29.jpg' },
      { id: 'c3po', name: 'C-3PO', subtitle: 'Protocol Droid', emoji: '🟡', image: 'https://upload.wikimedia.org/wikipedia/en/5/5c/C-3PO_droid.png' },
      { id: 'stormtrooper', name: 'Stormtrooper', subtitle: 'Imperial Soldier', emoji: '⚪', image: 'https://upload.wikimedia.org/wikipedia/en/e/eb/Stormtrooper_Corps.png' }
    ];
    let currentCharacter = null, sessionId = null, mediaRecorder = null, audioChunks = [], isRecording = false, isSpeaking = false, selfVideoStream = null;
    const contactsList = document.getElementById('contactsList'), facetimeScreen = document.getElementById('facetimeScreen'), facetimeBackground = document.getElementById('facetimeBackground'), facetimeName = document.getElementById('facetimeName'), facetimeStatus = document.getElementById('facetimeStatus'), subtitleText = document.getElementById('subtitleText'), endCallBtn = document.getElementById('endCallBtn'), talkBtn = document.getElementById('talkBtn'), againBtn = document.getElementById('againBtn'), statusTime = document.getElementById('statusTime'), audioPlayer = document.getElementById('audioPlayer'), selfVideo = document.getElementById('selfVideo');
    function updateTime() { const now = new Date(); let hours = now.getHours(); let minutes = now.getMinutes(); minutes = minutes < 10 ? '0' + minutes : minutes; statusTime.textContent = `${hours}:${minutes}`; } updateTime(); setInterval(updateTime, 1000);
    function renderContacts() { contactsList.innerHTML = characters.map(char => `<div class="contact-item" data-id="${char.id}"><div class="contact-avatar"><img src="${char.image}" alt="${char.name}" crossorigin="anonymous" onload="this.style.opacity=1" onerror="this.style.display='none'; this.parentElement.innerHTML='${char.emoji}';" style="opacity:0; transition: opacity 0.3s;"></div><div class="contact-info"><div class="contact-name">${char.name}</div><div class="contact-subtitle">${char.subtitle}</div></div><div class="contact-action"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></div></div>`).join(''); document.querySelectorAll('.contact-item').forEach(item => { item.addEventListener('click', () => startCall(item.dataset.id)); }); }
    async function startSelfVideo() { try { selfVideoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }); const video = document.createElement('video'); video.srcObject = selfVideoStream; video.autoplay = true; video.playsInline = true; video.muted = true; selfVideo.innerHTML = ''; selfVideo.appendChild(video); } catch (e) { console.log('Camera not available:', e); } }
    function stopSelfVideo() { if (selfVideoStream) { selfVideoStream.getTracks().forEach(track => track.stop()); selfVideoStream = null; } selfVideo.innerHTML = `<div class="self-video-placeholder"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>`; }
    async function setupRecording() { try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' }); mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); }; mediaRecorder.onstop = async () => { const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); audioChunks = []; await sendAudio(audioBlob); }; return true; } catch (e) { console.error('Microphone not available:', e); return false; } }
    function startRecording() { if (!mediaRecorder || isRecording) return; audioChunks = []; mediaRecorder.start(); isRecording = true; talkBtn.classList.add('recording'); }
    function stopRecording() { if (!mediaRecorder || !isRecording) return; mediaRecorder.stop(); isRecording = false; talkBtn.classList.remove('recording'); }
    async function startCall(characterId) { currentCharacter = characters.find(c => c.id === characterId); if (!currentCharacter) return; facetimeScreen.classList.add('active', 'connecting'); facetimeBackground.style.backgroundImage = `url('${currentCharacter.image}')`; facetimeName.textContent = currentCharacter.name; facetimeStatus.textContent = 'Connecting...'; subtitleText.textContent = ''; subtitleText.classList.remove('visible'); setButtonsEnabled(false); startSelfVideo(); await setupRecording(); try { const response = await fetch(`${API_BASE}/api/startCall`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ character: characterId }) }); const data = await response.json(); if (data.error) throw new Error(data.error); sessionId = data.sessionId; facetimeScreen.classList.remove('connecting'); facetimeStatus.textContent = 'FaceTime Video'; showSubtitle(data.text); await playAudio(data.audio); setButtonsEnabled(true); } catch (error) { console.error('Start call error:', error); facetimeStatus.textContent = 'Connection failed'; setTimeout(endCall, 2000); } }
    async function sendAudio(audioBlob) { if (!sessionId) return; setButtonsEnabled(false); showThinking(); try { const formData = new FormData(); formData.append('character', currentCharacter.id); formData.append('sessionId', sessionId); formData.append('audio', audioBlob); const response = await fetch(`${API_BASE}/api/chat`, { method: 'POST', body: formData }); const data = await response.json(); if (data.error) throw new Error(data.error); showSubtitle(data.text); await playAudio(data.audio); setButtonsEnabled(true); } catch (error) { console.error('Chat error:', error); showSubtitle("Hmm, I didn't catch that!"); setButtonsEnabled(true); } }
    async function sendIntent(intent) { if (!sessionId) return; setButtonsEnabled(false); showThinking(); try { const formData = new FormData(); formData.append('character', currentCharacter.id); formData.append('sessionId', sessionId); formData.append('intent', intent); const response = await fetch(`${API_BASE}/api/chat`, { method: 'POST', body: formData }); const data = await response.json(); if (data.error) throw new Error(data.error); showSubtitle(data.text); await playAudio(data.audio); setButtonsEnabled(true); } catch (error) { console.error('Intent error:', error); setButtonsEnabled(true); } }
    function showSubtitle(text) { subtitleText.textContent = text; subtitleText.classList.add('visible'); }
    function showThinking() { subtitleText.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div>'; subtitleText.classList.add('visible'); }
    function showSpeaking() { facetimeStatus.innerHTML = '<div class="speaking-waves"><span></span><span></span><span></span><span></span><span></span></div>'; }
    function setButtonsEnabled(enabled) { talkBtn.disabled = !enabled; againBtn.disabled = !enabled; }
    async function playAudio(audioDataUrl) { return new Promise((resolve) => { if (!audioDataUrl) { resolve(); return; } isSpeaking = true; showSpeaking(); audioPlayer.src = audioDataUrl; audioPlayer.onended = () => { isSpeaking = false; facetimeStatus.textContent = 'FaceTime Video'; resolve(); }; audioPlayer.onerror = () => { isSpeaking = false; facetimeStatus.textContent = 'FaceTime Video'; resolve(); }; audioPlayer.play().catch(() => { isSpeaking = false; resolve(); }); }); }
    function endCall() { stopSelfVideo(); if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); audioPlayer.pause(); audioPlayer.src = ''; if (sessionId) fetch(`${API_BASE}/api/endCall`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId }) }).catch(() => {}); sessionId = null; currentCharacter = null; isRecording = false; isSpeaking = false; facetimeScreen.classList.remove('active', 'connecting'); subtitleText.classList.remove('visible'); }
    endCallBtn.addEventListener('click', endCall);
    talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isSpeaking) startRecording(); }); talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); }); talkBtn.addEventListener('mousedown', () => { if (!isSpeaking) startRecording(); }); talkBtn.addEventListener('mouseup', stopRecording); talkBtn.addEventListener('mouseleave', stopRecording);
    againBtn.addEventListener('click', () => { if (!isSpeaking) sendIntent('again'); });
    renderContacts();
  </script>
</body>
</html>
